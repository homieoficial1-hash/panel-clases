<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>NQ PROJECT · Clases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0D;--surface:#141414;--surface2:#1b1b1b;--paper:#F7F3EF;
    --muted:rgba(247,243,239,.55);--faint:rgba(247,243,239,.35);
    --line:rgba(247,243,239,.12);--glass:rgba(247,243,239,.05);
    --green:#3ddc84;--red:#ff6b6b;
    --font:"Outfit","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--paper);font-family:var(--font);font-weight:300;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

  /* ===== LOGIN ===== */
  #login-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #login-screen h1{font-weight:600;font-size:26px;letter-spacing:-.01em}
  #login-screen p{color:var(--muted);font-size:14px;max-width:340px;line-height:1.5}
  .btn-google{display:inline-flex;align-items:center;gap:10px;background:var(--paper);color:#111;border:none;border-radius:12px;padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
  .btn-google:active{transform:scale(.98)}
  .denied{color:var(--red);font-size:13px}

  /* ===== APP SHELL ===== */
  #app-screen{display:none;flex-direction:column;min-height:100dvh}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px clamp(16px,4vw,28px);background:rgba(13,13,13,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:15px;font-weight:700;letter-spacing:.14em}
  .brand span{font-size:11px;color:var(--muted)}
  .who{display:flex;align-items:center;gap:12px}
  .who-email{font-size:12px;color:var(--muted);max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .out{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
  .out:active{transform:scale(.97)}

  .tabs{display:flex;gap:4px;padding:12px clamp(16px,4vw,28px) 0}
  .tab{background:transparent;border:none;color:var(--muted);font-size:14.5px;font-weight:500;padding:10px 16px;cursor:pointer;border-radius:10px 10px 0 0;position:relative}
  .tab.active{color:var(--paper)}
  .tab.active::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:2px;background:var(--paper);border-radius:2px}

  .wrap{flex:1;padding:18px clamp(16px,4vw,28px) 60px;max-width:1100px;width:100%;margin:0 auto}
  .pane{display:none;animation:fade .3s ease}
  .pane.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .count{color:var(--muted);font-size:13px}
  .row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:14px;color:var(--paper);min-width:200px;flex:1}
  .search::placeholder{color:var(--faint)}
  .add{display:inline-flex;align-items:center;gap:7px;background:var(--paper);color:#111;border:none;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .add:active{transform:scale(.98)}
  .add svg{width:16px;height:16px}

  /* ===== ALUMNOS ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .scard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
  .scard h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .scard .wa{display:inline-block;margin-top:4px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .scard .wa:hover{color:var(--paper)}
  .stats{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);background:var(--glass);border-radius:100px;padding:5px 11px;color:var(--paper)}
  .pill b{font-weight:700}
  .pill .g{color:var(--green)}
  .snotes{font-size:13px;color:var(--muted);line-height:1.5;white-space:pre-wrap;word-break:break-word;
    max-height:84px;overflow:auto;border-top:1px solid var(--line);padding-top:11px;margin-top:2px}
  .scard-actions{display:flex;gap:8px;margin-top:14px}
  .mini{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer}
  .mini.danger{color:var(--red);border-color:rgba(255,107,107,.35)}
  .mini:active{transform:scale(.97)}

  .empty{color:var(--faint);font-size:14px;text-align:center;padding:50px 10px}

  /* ===== CALENDARIO ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .cal-title{font-size:18px;font-weight:600;text-transform:capitalize;letter-spacing:-.01em}
  .nav{display:flex;gap:8px}
  .nav button,.today-btn{background:var(--surface);border:1px solid var(--line);color:var(--paper);border-radius:10px;cursor:pointer}
  .nav button{width:38px;height:38px;display:flex;align-items:center;justify-content:center}
  .nav button svg{width:16px;height:16px}
  .today-btn{padding:0 14px;height:38px;font-size:13px}
  .nav button:active,.today-btn:active{transform:scale(.96)}

  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
  .weekdays span{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:104px;padding:8px;cursor:pointer;
    display:flex;flex-direction:column;gap:5px;transition:border-color .15s, background .15s}
  .cell:hover{border-color:rgba(247,243,239,.28)}
  .cell.blank{background:transparent;border:1px dashed var(--line);cursor:default;opacity:.4}
  .cell.blank:hover{border-color:var(--line)}
  .cell.today{border-color:var(--paper)}
  .daynum{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
  .cell.today .daynum{color:var(--paper)}
  .daynum .dnum{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .cell.today .dnum{background:var(--paper);color:#111}
  .chip{display:flex;align-items:center;gap:6px;font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;overflow:hidden;white-space:nowrap}
  .chip .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .chip.hecha .dot{background:var(--green)}
  .chip.nohecha .dot{background:var(--red)}
  .chip.nohecha{text-decoration:line-through;color:var(--muted)}
  .chip .t{font-variant-numeric:tabular-nums;color:var(--muted)}
  .chip .nm{overflow:hidden;text-overflow:ellipsis}
  .more{font-size:11px;color:var(--faint);padding-left:2px}
  @media (max-width:640px){
    .cell{min-height:74px;border-radius:12px;padding:6px}
    .chip .nm{display:none}
    .chip{padding:3px 6px}
  }

  /* ===== MODALES ===== */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .ov.open{display:flex}
  @media(min-width:640px){.ov{align-items:center}}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:460px;max-height:92dvh;overflow:auto;padding:22px}
  @media(min-width:640px){.modal{border-radius:22px}}
  .modal h2{font-size:19px;font-weight:600;margin-bottom:16px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--paper)}
  .fld textarea{min-height:90px;resize:vertical;line-height:1.5}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:rgba(247,243,239,.4)}
  .two{display:flex;gap:10px}
  .two>*{flex:1}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:11px 6px;font-size:13px;font-weight:500;cursor:pointer}
  .seg button.on{color:#111;background:var(--paper);border-color:var(--paper)}
  .seg button.on.hecha{background:var(--green);border-color:var(--green)}
  .seg button.on.nohecha{background:var(--red);border-color:var(--red);color:#fff}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .primary{flex:1;background:var(--paper);color:#111;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
  .modal-actions .ghost{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:13px 18px;font-size:15px;cursor:pointer}
  .primary:active,.ghost:active{transform:scale(.98)}

  /* día modal */
  .dia-class{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--surface2)}
  .dia-class .line1{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dia-class .nm{font-size:15px;font-weight:600}
  .dia-class .hr{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dia-seg{display:flex;gap:6px}
  .dia-seg button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 4px;font-size:12px;cursor:pointer}
  .dia-seg button.on{color:#111;background:var(--paper);border-color:var(--paper)}
  .dia-seg button.on.hecha{background:var(--green);border-color:var(--green)}
  .dia-seg button.on.nohecha{background:var(--red);border-color:var(--red);color:#fff}
  .dia-class .row2{display:flex;gap:8px;justify-content:flex-end}
  .link-del{background:none;border:none;color:var(--red);font-size:12.5px;cursor:pointer;padding:4px}
  .link-ed{background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:4px}
</style>
</head>
<body>

<div id="login-screen">
  <h1>NQ PROJECT · Clases</h1>
  <p>Acceso privado. Inicia sesión con la cuenta de Google autorizada.</p>
  <button class="btn-google" id="btn-login">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.2 13.5 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-3.9 6.7-9.7 6.7-16.4z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.3-5.7c-2 1.4-4.7 2.3-8.2 2.3-6.4 0-11.8-4-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
    Iniciar sesión con Google
  </button>
  <p class="denied" id="denied" style="display:none">Este correo no tiene acceso a esta plataforma.</p>
</div>

<div id="app-screen">
  <header class="top">
    <div class="brand"><b>NQ PROJECT</b><span>Clases y alumnos</span></div>
    <div class="who">
      <span class="who-email" id="who-email"></span>
      <button class="out" id="btn-logout">Salir</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="calendario">Calendario</button>
    <button class="tab" data-tab="alumnos">Alumnos</button>
  </div>

  <div class="wrap">
    <!-- CALENDARIO -->
    <section class="pane active" id="pane-calendario">
      <div class="cal-head">
        <div class="cal-title" id="cal-title">—</div>
        <div class="nav">
          <button id="cal-prev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="today-btn" id="cal-today">Hoy</button>
          <button id="cal-next" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="bar" style="margin-bottom:12px">
        <span class="count" id="cal-count"></span>
        <button class="add" id="btn-new-clase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Agregar clase</button>
      </div>
      <div class="weekdays"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <!-- ALUMNOS -->
    <section class="pane" id="pane-alumnos">
      <div class="bar">
        <div class="row-actions" style="flex:1">
          <input class="search" id="al-search" placeholder="Buscar alumno…">
        </div>
        <button class="add" id="btn-new-alumno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Agregar alumno</button>
      </div>
      <p class="count" id="al-count" style="margin-bottom:14px"></p>
      <div class="grid" id="al-grid"></div>
    </section>
  </div>
</div>

<!-- MODAL ALUMNO -->
<div class="ov" id="ov-alumno">
  <div class="modal">
    <h2 id="al-modal-title">Agregar alumno</h2>
    <div class="fld"><label>Nombre</label><input id="f-nombre" placeholder="Nombre del alumno"></div>
    <div class="fld"><label>WhatsApp (opcional)</label><input id="f-whatsapp" placeholder="+57 300 000 0000"></div>
    <div class="fld"><label>Anotaciones</label><textarea id="f-notas" placeholder="Notas sobre el alumno, avances, temas pendientes…"></textarea></div>
    <div class="modal-actions">
      <button class="ghost" id="al-cancel">Cancelar</button>
      <button class="primary" id="al-save">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL CLASE -->
<div class="ov" id="ov-clase">
  <div class="modal">
    <h2 id="cl-modal-title">Agregar clase</h2>
    <div class="fld"><label>Alumno</label><select id="c-alumno"></select></div>
    <div class="two">
      <div class="fld"><label>Fecha</label><input id="c-fecha" type="date"></div>
      <div class="fld"><label>Hora</label><input id="c-hora" type="time"></div>
    </div>
    <div class="fld">
      <label>Estado</label>
      <div class="seg" id="c-estado">
        <button type="button" data-e="pendiente" class="on">Pendiente</button>
        <button type="button" data-e="hecha">Hecha</button>
        <button type="button" data-e="nohecha">No se hizo</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="ghost" id="cl-cancel">Cancelar</button>
      <button class="primary" id="cl-save">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL DÍA -->
<div class="ov" id="ov-dia">
  <div class="modal">
    <h2 id="dia-title">Clases</h2>
    <div id="dia-body"></div>
    <div class="modal-actions">
      <button class="ghost" id="dia-close">Cerrar</button>
      <button class="primary" id="dia-add">Agregar clase este día</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  /* ===== CONFIG (mismo proyecto Firebase que la postulación y el panel) ===== */
  const firebaseConfig = {
    apiKey: "AIzaSyDk4N2HXdiFzRYBXOgjxNs2t34uDBpVi4I",
    authDomain: "nq-postulaciones.firebaseapp.com",
    projectId: "nq-postulaciones",
    storageBucket: "nq-postulaciones.firebasestorage.app",
    messagingSenderId: "191712162801",
    appId: "1:191712162801:web:fa7adbc9abcff228a2ca50"
  };
  /* ===== CORREO(S) CON ACCESO — cambia o agrega aquí ===== */
  const ALLOWED_EMAILS = ['a1adsagencia@gmail.com','homieoficial1@gmail.com'];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = id => document.getElementById(id);

  $('btn-login').onclick = ()=>{ $('denied').style.display='none'; signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>console.error(e)); };
  $('btn-logout').onclick = ()=> signOut(auth);

  let unsubEst=null, unsubCla=null;
  onAuthStateChanged(auth, (user)=>{
    if(user && ALLOWED_EMAILS.includes(user.email)){
      $('login-screen').style.display='none';
      $('app-screen').style.display='flex';
      $('who-email').textContent = user.email;
      startListeners();
    } else {
      if(unsubEst) unsubEst(); if(unsubCla) unsubCla();
      $('app-screen').style.display='none';
      $('login-screen').style.display='flex';
      if(user){ $('denied').style.display='block'; signOut(auth); }
    }
  });

  /* ===== TABS ===== */
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('pane-'+t.dataset.tab).classList.add('active');
    };
  });

  /* ===== DATA ===== */
  let estudiantes = [], clases = [];
  const estById = {};
  function startListeners(){
    unsubEst = onSnapshot(query(collection(db,'estudiantes'), orderBy('creadoEn','desc')), snap=>{
      estudiantes = snap.docs.map(d=>({id:d.id, ...d.data()}));
      Object.keys(estById).forEach(k=>delete estById[k]);
      estudiantes.forEach(e=> estById[e.id]=e);
      renderAlumnos(); renderCalendario(); fillAlumnoSelect();
    });
    unsubCla = onSnapshot(collection(db,'clases'), snap=>{
      clases = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderAlumnos(); renderCalendario();
    });
  }

  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ===================== ALUMNOS ===================== */
  $('al-search').addEventListener('input', renderAlumnos);

  function statsFor(estId){
    const list = clases.filter(c=>c.estudianteId===estId);
    return { hechas:list.filter(c=>c.estado==='hecha').length, prog:list.length };
  }

  function renderAlumnos(){
    const term = $('al-search').value.trim().toLowerCase();
    const rows = estudiantes.filter(e=>!term || (e.nombre||'').toLowerCase().includes(term));
    $('al-count').textContent = rows.length + (rows.length===1?' alumno':' alumnos');
    const g = $('al-grid'); g.innerHTML='';
    if(rows.length===0){ g.innerHTML = '<p class="empty">Aún no hay alumnos. Agrega el primero.</p>'; return; }
    rows.forEach(e=>{
      const s = statsFor(e.id);
      const wa = (e.whatsapp||'').replace(/[^\d+]/g,'');
      const card = document.createElement('div'); card.className='scard';
      card.innerHTML = `
        <h3>${esc(e.nombre||'Sin nombre')}</h3>
        ${e.whatsapp?`<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(e.whatsapp)} →</a>`:''}
        <div class="stats">
          <span class="pill"><b class="g">${s.hechas}</b> clases realizadas</span>
          <span class="pill"><b>${s.prog}</b> programadas</span>
        </div>
        ${e.notas?`<div class="snotes">${esc(e.notas)}</div>`:''}
        <div class="scard-actions">
          <button class="mini ed">Editar</button>
          <button class="mini danger del">Eliminar</button>
        </div>`;
      card.querySelector('.ed').onclick = ()=> openAlumno(e);
      card.querySelector('.del').onclick = ()=>{
        if(confirm(`¿Eliminar a ${e.nombre}? Sus clases NO se borran.`)) deleteDoc(doc(db,'estudiantes',e.id)).catch(console.error);
      };
      g.appendChild(card);
    });
  }

  let editEstId = null;
  $('btn-new-alumno').onclick = ()=> openAlumno(null);
  $('al-cancel').onclick = ()=> $('ov-alumno').classList.remove('open');
  function openAlumno(e){
    editEstId = e? e.id : null;
    $('al-modal-title').textContent = e? 'Editar alumno' : 'Agregar alumno';
    $('f-nombre').value = e?.nombre || '';
    $('f-whatsapp').value = e?.whatsapp || '';
    $('f-notas').value = e?.notas || '';
    $('ov-alumno').classList.add('open');
    setTimeout(()=>$('f-nombre').focus(), 100);
  }
  $('al-save').onclick = ()=>{
    const nombre = $('f-nombre').value.trim();
    if(!nombre){ $('f-nombre').focus(); return; }
    const data = { nombre, whatsapp:$('f-whatsapp').value.trim(), notas:$('f-notas').value.trim() };
    $('ov-alumno').classList.remove('open');
    (editEstId ? updateDoc(doc(db,'estudiantes',editEstId), data)
               : (()=>{ data.creadoEn=serverTimestamp(); return addDoc(collection(db,'estudiantes'), data); })())
      .catch(err=>{ console.error(err); alert('No se pudo guardar.'); });
  };

  /* ===================== CALENDARIO ===================== */
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const ESTADO_LABEL = { pendiente:'Pendiente', hecha:'Hecha', nohecha:'No se hizo' };
  let viewY, viewM;
  (function(){ const n=new Date(); viewY=n.getFullYear(); viewM=n.getMonth(); })();

  function ymd(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  function todayStr(){ const n=new Date(); return ymd(n.getFullYear(),n.getMonth(),n.getDate()); }

  $('cal-prev').onclick = ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderCalendario(); };
  $('cal-next').onclick = ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderCalendario(); };
  $('cal-today').onclick = ()=>{ const n=new Date(); viewY=n.getFullYear(); viewM=n.getMonth(); renderCalendario(); };

  function renderCalendario(){
    if(!$('cal-grid')) return;
    $('cal-title').textContent = `${MESES[viewM]} ${viewY}`;
    const first = new Date(viewY, viewM, 1);
    const startBlank = (first.getDay()+6)%7;        // lunes primero
    const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
    const tstr = todayStr();

    const byDay = {};
    clases.forEach(c=>{ (byDay[c.fecha] = byDay[c.fecha]||[]).push(c); });
    const monthCount = clases.filter(c=> c.fecha && c.fecha.startsWith(`${viewY}-${String(viewM+1).padStart(2,'0')}`)).length;
    $('cal-count').textContent = monthCount + (monthCount===1?' clase este mes':' clases este mes');

    const grid = $('cal-grid'); grid.innerHTML='';
    for(let i=0;i<startBlank;i++){ const b=document.createElement('div'); b.className='cell blank'; grid.appendChild(b); }
    for(let d=1; d<=daysInMonth; d++){
      const ds = ymd(viewY,viewM,d);
      const list = (byDay[ds]||[]).slice().sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
      const cell = document.createElement('div');
      cell.className = 'cell' + (ds===tstr?' today':'');
      let chips = list.slice(0,3).map(c=>{
        const nm = (estById[c.estudianteId]?.nombre) || c.estudianteNombre || 'Alumno';
        return `<div class="chip ${c.estado||'pendiente'}"><span class="dot"></span><span class="t">${esc(c.hora||'')}</span><span class="nm">${esc(nm)}</span></div>`;
      }).join('');
      if(list.length>3) chips += `<div class="more">+${list.length-3} más</div>`;
      cell.innerHTML = `<div class="daynum"><span class="dnum">${d}</span></div>${chips}`;
      cell.onclick = ()=> openDia(ds);
      grid.appendChild(cell);
    }
  }

  /* ---- modal clase ---- */
  let editClaseId = null, claseEstado = 'pendiente';
  function fillAlumnoSelect(){
    const sel = $('c-alumno'); if(!sel) return;
    const cur = sel.value;
    sel.innerHTML = estudiantes.length
      ? estudiantes.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')
      : '<option value="">— Agrega un alumno primero —</option>';
    if(cur) sel.value = cur;
  }
  document.querySelectorAll('#c-estado button').forEach(btn=>{
    btn.onclick = ()=>{
      claseEstado = btn.dataset.e;
      document.querySelectorAll('#c-estado button').forEach(b=>{ b.className=''; });
      btn.className = 'on ' + (claseEstado==='hecha'?'hecha':claseEstado==='nohecha'?'nohecha':'');
    };
  });
  $('btn-new-clase').onclick = ()=> openClase(null, todayStr());
  $('cl-cancel').onclick = ()=> $('ov-clase').classList.remove('open');
  function openClase(c, prefillDate){
    if(estudiantes.length===0){ alert('Primero agrega al menos un alumno en la pestaña "Alumnos".'); return; }
    fillAlumnoSelect();
    editClaseId = c? c.id : null;
    $('cl-modal-title').textContent = c? 'Editar clase' : 'Agregar clase';
    $('c-alumno').value = c?.estudianteId || estudiantes[0].id;
    $('c-fecha').value = c?.fecha || prefillDate || todayStr();
    $('c-hora').value = c?.hora || '';
    claseEstado = c?.estado || 'pendiente';
    document.querySelectorAll('#c-estado button').forEach(b=>{
      const on = b.dataset.e===claseEstado;
      b.className = on ? ('on ' + (claseEstado==='hecha'?'hecha':claseEstado==='nohecha'?'nohecha':'')) : '';
    });
    $('ov-dia').classList.remove('open');
    $('ov-clase').classList.add('open');
  }
  $('cl-save').onclick = ()=>{
    const estudianteId = $('c-alumno').value;
    const fecha = $('c-fecha').value;
    if(!estudianteId || !fecha){ return; }
    const data = {
      estudianteId,
      estudianteNombre: (estById[estudianteId]?.nombre)||'',
      fecha,
      hora: $('c-hora').value || '',
      estado: claseEstado
    };
    $('ov-clase').classList.remove('open');
    (editClaseId ? updateDoc(doc(db,'clases',editClaseId), data)
                 : (()=>{ data.creadoEn=serverTimestamp(); return addDoc(collection(db,'clases'), data); })())
      .catch(err=>{ console.error(err); alert('No se pudo guardar la clase.'); });
  };

  /* ---- modal día ---- */
  let diaActual = null;
  $('dia-close').onclick = ()=> $('ov-dia').classList.remove('open');
  $('dia-add').onclick = ()=> openClase(null, diaActual);
  function fechaBonita(ds){
    const [y,m,d] = ds.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    return `${dias[dt.getDay()]} ${d} de ${MESES[m-1]}`;
  }
  function openDia(ds){
    diaActual = ds;
    $('dia-title').textContent = fechaBonita(ds);
    const list = clases.filter(c=>c.fecha===ds).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    const body = $('dia-body');
    if(list.length===0){ body.innerHTML = '<p class="empty" style="padding:24px 0">No hay clases este día.</p>'; }
    else{
      body.innerHTML = list.map(c=>{
        const nm = (estById[c.estudianteId]?.nombre)||c.estudianteNombre||'Alumno';
        const seg = ['pendiente','hecha','nohecha'].map(e=>{
          const on = (c.estado||'pendiente')===e;
          return `<button data-id="${c.id}" data-e="${e}" class="${on?('on '+(e==='hecha'?'hecha':e==='nohecha'?'nohecha':'')):''}">${ESTADO_LABEL[e]}</button>`;
        }).join('');
        return `<div class="dia-class">
          <div class="line1"><span class="nm">${esc(nm)}</span><span class="hr">${esc(c.hora||'—')}</span></div>
          <div class="dia-seg" data-id="${c.id}">${seg}</div>
          <div class="row2"><button class="link-ed" data-ed="${c.id}">Editar</button><button class="link-del" data-del="${c.id}">Eliminar</button></div>
        </div>`;
      }).join('');
      body.querySelectorAll('.dia-seg button').forEach(b=>{
        b.onclick = ()=> updateDoc(doc(db,'clases',b.dataset.id), {estado:b.dataset.e}).catch(console.error);
      });
      body.querySelectorAll('[data-del]').forEach(b=>{
        b.onclick = ()=>{ if(confirm('¿Eliminar esta clase?')) deleteDoc(doc(db,'clases',b.dataset.del)).catch(console.error); };
      });
      body.querySelectorAll('[data-ed]').forEach(b=>{
        b.onclick = ()=>{ const c = clases.find(x=>x.id===b.dataset.ed); if(c) openClase(c, ds); };
      });
    }
    $('ov-dia').classList.add('open');
  }

  /* cerrar modales al tocar el fondo */
  document.querySelectorAll('.ov').forEach(ov=>{
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.classList.remove('open'); });
  });
</script>
</body>
</html>
